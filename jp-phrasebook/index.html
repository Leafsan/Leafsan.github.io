<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8f2434"><title>알레아 일본 여행 표현집</title><style>
:root{--bg:#f7f3ee;--card:#fffdfa;--text:#211b1c;--muted:#766b6d;--line:#ded5d0;--accent:#8f2434;--accent2:#f2dde1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Hiragino Sans",sans-serif}button,input{font:inherit}.app{max-width:680px;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}header{padding:8px 2px 12px}h1{font-size:24px;margin:0;color:var(--accent);font-family:Georgia,serif}.sub,.muted{font-size:13px;color:var(--muted)}.controls{display:grid;grid-template-columns:1fr auto;gap:8px}input[type=search]{min-height:46px;width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;padding:0 13px;font-size:16px}.btn,.tab{min-height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 12px}.btn.on,.tab.active,.fav.on{background:var(--accent2);border-color:var(--accent);color:var(--accent)}.tabs,.toolbar{display:flex;gap:8px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:none}.tab,.toolbar .btn{flex:0 0 auto}.tab{border-radius:999px}.meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin:7px 2px 10px}.status{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin:4px 0 12px}.list{display:grid;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.top{display:flex;gap:10px;align-items:flex-start}.content{flex:1;min-width:0}.jp{font-size:20px;line-height:1.45;font-weight:700}.fu{font-size:13px;color:var(--muted);margin-top:3px}.ko{font-size:15px;margin-top:8px}.meaning{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.45}.tag{display:inline-block;font-size:12px;color:var(--muted);margin-top:8px}.fav{min-width:44px;min-height:44px;border-radius:11px;border:1px solid var(--line);background:#fff;font-size:20px}.hidden{display:none!important}.empty{padding:28px 10px;text-align:center;color:var(--muted)}@media(min-width:560px){.jp{font-size:22px}}
</style></head><body><main class="app"><header><h1>日本語 Phrasebook</h1><div class="sub">알레아 일본 여행 표현집</div></header><div class="controls"><input id="search" type="search" placeholder="일본어 · 발음 · 뜻 검색"><button id="favOnly" class="btn" type="button">★ 즐겨찾기</button></div><div id="tabs" class="tabs"></div><div class="meta"><span id="count"></span><span>기본 표현 내장</span></div><div class="toolbar"><button id="export" class="btn">즐겨찾기 JSON 내보내기</button><label class="btn" style="display:flex;align-items:center;cursor:pointer">JSON 가져오기<input id="import" type="file" accept=".json,application/json" hidden></label><button id="clear" class="btn">초기화</button></div><div id="status" class="status">즐겨찾기는 이 기기의 브라우저에 자동 저장됩니다.</div><section id="list" class="list"></section><div id="empty" class="empty hidden">조건에 맞는 표현이 없습니다.</div></main><script>
const P=[{"id":1,"category":"기본","japanese":"すみません。","furigana":"すみません","korean_pronunciation":"스미마센","meaning":"실례합니다 / 저기요 / 죄송합니다."},{"id":2,"category":"기본","japanese":"ありがとうございます。","furigana":"ありがとうございます","korean_pronunciation":"아리가토- 고자이마스","meaning":"감사합니다."},{"id":3,"category":"기본","japanese":"大丈夫です。","furigana":"だいじょうぶです","korean_pronunciation":"다이죠-부 데스","meaning":"괜찮습니다."},{"id":4,"category":"기본","japanese":"お願いします。","furigana":"おねがいします","korean_pronunciation":"오네가이시마스","meaning":"부탁드립니다 / 이걸로 부탁합니다."},{"id":5,"category":"기본","japanese":"わかりません。","furigana":"わかりません","korean_pronunciation":"와카리마센","meaning":"모르겠습니다."},{"id":6,"category":"기본","japanese":"もう一度お願いします。","furigana":"もういちど おねがいします","korean_pronunciation":"모- 이치도 오네가이시마스","meaning":"한 번 더 부탁드립니다."},{"id":7,"category":"기본","japanese":"もう少しゆっくりお願いします。","furigana":"もうすこし ゆっくり おねがいします","korean_pronunciation":"모- 스코시 윳쿠리 오네가이시마스","meaning":"조금만 천천히 말씀해 주세요."},{"id":10,"category":"이동","japanese":"浅草駅はどこですか？","furigana":"あさくさえきは どこですか","korean_pronunciation":"아사쿠사에키와 도코 데스카?","meaning":"아사쿠사역은 어디인가요?"},{"id":11,"category":"이동","japanese":"この電車で合っていますか？","furigana":"この でんしゃで あっていますか","korean_pronunciation":"코노 덴샤데 앗테이마스카?","meaning":"이 전철 타는 게 맞나요?"},{"id":12,"category":"이동","japanese":"この電車は秋葉原に行きますか？","furigana":"この でんしゃは あきはばらに いきますか","korean_pronunciation":"코노 덴샤와 아키하바라니 이키마스카?","meaning":"이 전철 아키하바라에 가나요?"},{"id":13,"category":"이동","japanese":"何番線ですか？","furigana":"なんばんせんですか","korean_pronunciation":"난반센 데스카?","meaning":"몇 번 승강장인가요?"},{"id":20,"category":"호텔","japanese":"チェックインをお願いします。","furigana":"チェックインを おねがいします","korean_pronunciation":"쳇쿠인오 오네가이시마스","meaning":"체크인 부탁드립니다."},{"id":21,"category":"호텔","japanese":"予約しています。","furigana":"よやくしています","korean_pronunciation":"요야쿠 시테이마스","meaning":"예약했습니다."},{"id":22,"category":"호텔","japanese":"荷物を預かってもらえますか？","furigana":"にもつを あずかって もらえますか","korean_pronunciation":"니모츠오 아즈캇테 모라에마스카?","meaning":"짐을 맡아주실 수 있나요?"},{"id":30,"category":"식당","japanese":"一人です。","furigana":"ひとりです","korean_pronunciation":"히토리 데스","meaning":"한 명입니다."},{"id":31,"category":"식당","japanese":"これをお願いします。","furigana":"これを おねがいします","korean_pronunciation":"코레오 오네가이시마스","meaning":"이걸로 주세요."},{"id":32,"category":"식당","japanese":"おすすめは何ですか？","furigana":"おすすめは なんですか","korean_pronunciation":"오스스메와 난 데스카?","meaning":"추천 메뉴가 뭐예요?"},{"id":33,"category":"식당","japanese":"お水をお願いします。","furigana":"おみずを おねがいします","korean_pronunciation":"오미즈오 오네가이시마스","meaning":"물 부탁드립니다."},{"id":34,"category":"식당","japanese":"お会計お願いします。","furigana":"おかいけい おねがいします","korean_pronunciation":"오카이케이 오네가이시마스","meaning":"계산 부탁드립니다."},{"id":35,"category":"식당","japanese":"カードは使えますか？","furigana":"カードは つかえますか","korean_pronunciation":"카-도와 츠카에마스카?","meaning":"카드 사용할 수 있나요?"},{"id":40,"category":"쇼핑","japanese":"これはいくらですか？","furigana":"これは いくらですか","korean_pronunciation":"코레와 이쿠라 데스카?","meaning":"이거 얼마인가요?"},{"id":41,"category":"쇼핑","japanese":"これを一つください。","furigana":"これを ひとつ ください","korean_pronunciation":"코레오 히토츠 쿠다사이","meaning":"이거 하나 주세요."},{"id":42,"category":"쇼핑","japanese":"在庫はありますか？","furigana":"ざいこは ありますか","korean_pronunciation":"자이코와 아리마스카?","meaning":"재고 있나요?"},{"id":43,"category":"쇼핑","japanese":"これは限定品ですか？","furigana":"これは げんていひんですか","korean_pronunciation":"코레와 겐테이힌 데스카?","meaning":"이거 한정품인가요?"},{"id":44,"category":"쇼핑","japanese":"日本限定ですか？","furigana":"にほんげんていですか","korean_pronunciation":"니혼 겐테이 데스카?","meaning":"일본 한정인가요?"},{"id":45,"category":"쇼핑","japanese":"免税できますか？","furigana":"めんぜい できますか","korean_pronunciation":"멘제이 데키마스카?","meaning":"면세 가능한가요?"},{"id":46,"category":"쇼핑","japanese":"あとで戻ってきても大丈夫ですか？","furigana":"あとで もどってきても だいじょうぶですか","korean_pronunciation":"아토데 모돗테키테모 다이죠-부 데스카?","meaning":"나중에 다시 와도 괜찮을까요?"},{"id":47,"category":"쇼핑","japanese":"売り切れそうですか？","furigana":"うりきれそうですか","korean_pronunciation":"우리키레소- 데스카?","meaning":"품절될 것 같나요?"},{"id":50,"category":"MGCON","japanese":"当日券を一枚お願いします。","furigana":"とうじつけんを いちまい おねがいします","korean_pronunciation":"토-지츠켄오 이치마이 오네가이시마스","meaning":"당일권 한 장 부탁드립니다."},{"id":51,"category":"MGCON","japanese":"韓国から来ました。","furigana":"かんこくから きました","korean_pronunciation":"칸코쿠카라 키마시타","meaning":"한국에서 왔습니다."},{"id":52,"category":"MGCON","japanese":"初めて来ました。","furigana":"はじめて きました","korean_pronunciation":"하지메테 키마시타","meaning":"처음 왔습니다."},{"id":53,"category":"MGCON","japanese":"このイベントを楽しみにしていました。","furigana":"この イベントを たのしみに していました","korean_pronunciation":"코노 이벤트오 타노시미니 시테이마시타","meaning":"이 행사를 기대하고 있었습니다."},{"id":60,"category":"소개","japanese":"韓国でミニチュアペイントを中心に活動しているVTuberです。","furigana":"かんこくで ミニチュアペイントを ちゅうしんに かつどうしている ブイチューバーです","korean_pronunciation":"칸코쿠데 미니츄아 페인토오 츄-신니 카츠도-시테이루 부이츄-바- 데스","meaning":"한국에서 미니어처 페인팅을 중심으로 활동하는 VTuber입니다."},{"id":61,"category":"소개","japanese":"「アレア」という名前で活動しています。","furigana":"「アレア」という なまえで かつどうしています","korean_pronunciation":"아레아토 이우 나마에데 카츠도-시테이마스","meaning":"알레아라는 이름으로 활동하고 있습니다."},{"id":62,"category":"소개","japanese":"これが私のチャンネルです。","furigana":"これが わたしの チャンネルです","korean_pronunciation":"코레가 와타시노 챤네루 데스","meaning":"이게 제 채널입니다."},{"id":63,"category":"소개","japanese":"QRコードから見られます。","furigana":"キューアールコードから みられます","korean_pronunciation":"큐-아-루 코-도카라 미라레마스","meaning":"QR코드로 보실 수 있습니다."},{"id":70,"category":"도색","japanese":"見てもいいですか？","furigana":"みても いいですか","korean_pronunciation":"미테모 이이 데스카?","meaning":"봐도 될까요?"},{"id":71,"category":"도색","japanese":"近くで見てもいいですか？","furigana":"ちかくで みても いいですか","korean_pronunciation":"치카쿠데 미테모 이이 데스카?","meaning":"가까이서 봐도 될까요?"},{"id":72,"category":"도색","japanese":"触ってもいいですか？","furigana":"さわっても いいですか","korean_pronunciation":"사왓테모 이이 데스카?","meaning":"만져봐도 될까요?"},{"id":73,"category":"도색","japanese":"塗装がすごいですね。","furigana":"とそうが すごいですね","korean_pronunciation":"토소-가 스고이 데스네","meaning":"도색이 정말 대단하네요."},{"id":74,"category":"도색","japanese":"どうやって塗ったんですか？","furigana":"どうやって ぬったんですか","korean_pronunciation":"도-얏테 눗탄 데스카?","meaning":"어떻게 칠하신 거예요?"},{"id":75,"category":"도색","japanese":"この塗料は何ですか？","furigana":"この とりょうは なんですか","korean_pronunciation":"코노 토료-와 난 데스카?","meaning":"이 도료는 뭔가요?"},{"id":76,"category":"도색","japanese":"この筆を試してもいいですか？","furigana":"この ふでを ためしても いいですか","korean_pronunciation":"코노 후데오 타메시테모 이이 데스카?","meaning":"이 붓을 시험해봐도 될까요?"},{"id":77,"category":"도색","japanese":"これは何号の筆ですか？","furigana":"これは なんごうの ふでですか","korean_pronunciation":"코레와 난고-노 후데 데스카?","meaning":"이거 몇 호 붓인가요?"},{"id":78,"category":"도색","japanese":"水で薄めていますか？","furigana":"みずで うすめていますか","korean_pronunciation":"미즈데 우스메테이마스카?","meaning":"물로 희석하고 있나요?"},{"id":80,"category":"촬영","japanese":"写真を撮ってもいいですか？","furigana":"しゃしんを とっても いいですか","korean_pronunciation":"샤신오 톳테모 이이 데스카?","meaning":"사진 찍어도 될까요?"},{"id":81,"category":"촬영","japanese":"動画を撮ってもいいですか？","furigana":"どうがを とっても いいですか","korean_pronunciation":"도-가오 톳테모 이이 데스카?","meaning":"영상 찍어도 될까요?"},{"id":82,"category":"촬영","japanese":"SNSに載せてもいいですか？","furigana":"エスエヌエスに のせても いいですか","korean_pronunciation":"에스에누에스니 노세테모 이이 데스카?","meaning":"SNS에 올려도 될까요?"},{"id":83,"category":"촬영","japanese":"YouTubeに載せてもいいですか？","furigana":"ユーチューブに のせても いいですか","korean_pronunciation":"유-츄-부니 노세테모 이이 데스카?","meaning":"유튜브에 올려도 될까요?"},{"id":84,"category":"촬영","japanese":"顔が映っても大丈夫ですか？","furigana":"かおが うつっても だいじょうぶですか","korean_pronunciation":"카오가 우츳테모 다이죠-부 데스카?","meaning":"얼굴이 나와도 괜찮으신가요?"},{"id":90,"category":"교류","japanese":"SNSはやっていますか？","furigana":"エスエヌエスは やっていますか","korean_pronunciation":"에스에누에스와 얏테이마스카?","meaning":"SNS 하시나요?"},{"id":91,"category":"교류","japanese":"Xをフォローしてもいいですか？","furigana":"エックスを フォローしても いいですか","korean_pronunciation":"엑쿠스오 훠로-시테모 이이 데스카?","meaning":"X 팔로우해도 될까요?"},{"id":92,"category":"교류","japanese":"アカウントを教えてもらえますか？","furigana":"アカウントを おしえて もらえますか","korean_pronunciation":"아카운토오 오시에테 모라에마스카?","meaning":"계정 알려주실 수 있나요?"},{"id":93,"category":"교류","japanese":"フォローしました。","furigana":"フォローしました","korean_pronunciation":"훠로- 시마시타","meaning":"팔로우했습니다."},{"id":94,"category":"교류","japanese":"とても参考になりました。","furigana":"とても さんこうに なりました","korean_pronunciation":"토테모 산코-니 나리마시타","meaning":"정말 참고가 됐습니다."},{"id":95,"category":"교류","japanese":"またお会いしましょう。","furigana":"また おあいしましょう","korean_pronunciation":"마타 오아이시마쇼-","meaning":"또 만나요."}];const DF=[1,2,51,60,70,72,80,81,43],STORE='alea.jp.phrasebook.favorites.v3';let fav=new Set(DF),cat='전체',favOnly=false;const $=s=>document.querySelector(s),list=$('#list'),tabs=$('#tabs'),search=$('#search'),count=$('#count'),status=$('#status');try{let x=localStorage.getItem(STORE);if(x)fav=new Set(JSON.parse(x).map(Number))}catch(e){}const cats=['전체',...new Set(P.map(x=>x.category))];function save(){try{localStorage.setItem(STORE,JSON.stringify([...fav]));status.textContent='즐겨찾기를 이 기기에 저장했습니다.'}catch(e){status.textContent='자동 저장이 제한됩니다. JSON으로 백업하세요.'}}function rt(){tabs.innerHTML='';cats.forEach(c=>{let b=document.createElement('button');b.className='tab'+(cat===c?' active':'');b.textContent=c;b.onclick=()=>{cat=c;rt();render()};tabs.appendChild(b)})}function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function render(){let q=search.value.trim().toLowerCase(),a=P.filter(x=>(cat==='전체'||x.category===cat)&&(!favOnly||fav.has(x.id))&&(!q||[x.japanese,x.furigana,x.korean_pronunciation,x.meaning,x.category].join(' ').toLowerCase().includes(q)));a.sort((x,y)=>(fav.has(y.id)-fav.has(x.id))||x.id-y.id);count.textContent=a.length+'개 표현';$('#empty').classList.toggle('hidden',a.length>0);list.innerHTML=a.map(x=>`<article class="card"><div class="top"><div class="content"><div class="jp">${esc(x.japanese)}</div><div class="fu">${esc(x.furigana)}</div><div class="ko">${esc(x.korean_pronunciation)}</div><div class="meaning">${esc(x.meaning)}</div><span class="tag">${esc(x.category)}</span></div><button class="fav ${fav.has(x.id)?'on':''}" data-id="${x.id}">${fav.has(x.id)?'★':'☆'}</button></div></article>`).join('');document.querySelectorAll('.fav').forEach(b=>b.onclick=()=>{let id=+b.dataset.id;fav.has(id)?fav.delete(id):fav.add(id);save();render()});$('#favOnly').classList.toggle('on',favOnly);$('#favOnly').textContent=favOnly?'★ 즐겨찾기만':'★ 즐겨찾기'}search.oninput=render;$('#favOnly').onclick=()=>{favOnly=!favOnly;render()};$('#clear').onclick=()=>{fav.clear();save();render()};$('#export').onclick=()=>{let blob=new Blob([JSON.stringify({version:3,updatedAt:new Date().toISOString(),favorites:[...fav]},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='alea_japan_phrasebook_favorites.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let j=JSON.parse(await f.text());if(!Array.isArray(j.favorites))throw 0;fav=new Set(j.favorites.map(Number));save();render();status.textContent='즐겨찾기를 복원했습니다.'}catch(_){alert('올바른 JSON 파일이 아닙니다.')}e.target.value=''};rt();render();
</script></body></html>
